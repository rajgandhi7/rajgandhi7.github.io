    - name: Research Summary 
      value: My research focuses on the development of mathematical models of the surface tension-driven instabilities in complex fluids (Colloidal dispersion). We highlight the peculiar nature of the surface tension in nanoparticle suspension and investigate the linear and nonlinear hydrodynamic stability under the action of heat and mass transfer.

